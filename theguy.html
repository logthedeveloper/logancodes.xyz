<!doctype html>
<html lang="en-us">

<head>
  <script>
  (function () {
    let lastSyncedJson = "";
    let initialLoadDone = false;
    let bootReady = false;
    const bootQueue = [];

    function finishBootWait() {
      if (bootReady) return;
      bootReady = true;
      while (bootQueue.length) {
        try { bootQueue.shift()(); } catch (e) {}
      }
    }

    // Allows applicationLoad() to wait briefly for cloud save before booting Love()
    window.__onCloudSaveReady = function (fn) {
      if (bootReady) fn();
      else bootQueue.push(fn);
    };

    // If opened standalone (not inside portal), boot immediately
    if (window.top === window.self) {
      finishBootWait();
      return;
    }

    // Fallback timeout so the game always boots within 1.2s even on slow connections
    setTimeout(function () {
      initialLoadDone = true;
      finishBootWait();
    }, 1200);

    // Walk up all parent frames so nested Google Apps Script / embed wrappers are bypassed
    function postToPortal(payload) {
      let win = window.parent;
      while (win) {
        try {
          win.postMessage(payload, "*");
          if (win === window.top) break;
          win = win.parent;
        } catch (e) {
          break;
        }
      }
    }

    // Receive saved localStorage from the main portal
    window.addEventListener("message", function (event) {
      const msg = event.data;
      if (!msg || msg.type !== "LOAD_CLOUD_SAVE") return;

      if (msg.storage) {
        try {
          const savedObj = JSON.parse(msg.storage);
          let changed = false;

          Object.keys(savedObj).forEach(function (key) {
            if (localStorage.getItem(key) !== savedObj[key]) {
              localStorage.setItem(key, savedObj[key]);
              changed = true;
            }
          });

          lastSyncedJson = JSON.stringify(localStorage);
          console.log("[CloudSave] Restored save from portal.");

          // If Love() already booted before the save arrived, reload once
          if (bootReady && changed && !sessionStorage.getItem("cloud_save_restored")) {
            sessionStorage.setItem("cloud_save_restored", "1");
            location.reload();
            return;
          }
        } catch (e) {
          console.warn("[CloudSave] Parse error:", e);
        }
      }

      initialLoadDone = true;
      finishBootWait();
    });

    // Ask the portal for this user's save
    postToPortal({ type: "REQUEST_CLOUD_SAVE" });
    setTimeout(function () {
      if (!bootReady) postToPortal({ type: "REQUEST_CLOUD_SAVE" });
    }, 350);

    // Send updated localStorage back to the main portal
    function pushSaveToPortal() {
      if (!initialLoadDone) return;
      try {
        const currentJson = JSON.stringify(localStorage);
        if (currentJson && currentJson !== "{}" && currentJson !== lastSyncedJson) {
          lastSyncedJson = currentJson;
          postToPortal({
            type: "SYNC_CLOUD_SAVE",
            storage: currentJson
          });
          console.log("[CloudSave] Synced progress to portal.");
        }
      } catch (e) {}
    }

    window.__triggerCloudSync = pushSaveToPortal;
    setInterval(pushSaveToPortal, 4000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") pushSaveToPortal();
    });
  })();
  </script>

  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">
  <title></title>
  <base href="https://cdn.jsdelivr.net/gh/thirstygithub/mathamatic-notes@master/">

  <!-- Load custom style sheet -->
  <link rel="stylesheet" type="text/css" href="theme/love.css">

  <script src="consolewrapper.js"></script>
  <script>
    if (typeof console !== 'undefined' && typeof console.debug !== 'function') {
      console.debug = console.log.bind(console);
    }
    var __logger = (typeof console !== 'undefined') ? console : null;
    if (typeof window !== 'undefined') {
      if (typeof window.__getWebDB !== 'function') {
        window.__getWebDB = function(name) {
          try {
            return window.localStorage ? window.localStorage.getItem(name) : null;
          } catch (err) {
            if (__logger && __logger.warn) {
              __logger.warn('Unable to access localStorage for __getWebDB:', err);
            }
            return null;
          }
        };
      }
      if (typeof window.__setWebDB !== 'function') {
        window.__setWebDB = function(name, value) {
          try {
            if (window.localStorage) {
              window.localStorage.setItem(name, value);
              if (window.__triggerCloudSync) {
                setTimeout(window.__triggerCloudSync, 500);
              }
              return true;
            }
          } catch (err) {
            if (__logger && __logger.warn) {
              __logger.warn('Unable to access localStorage for __setWebDB:', err);
            }
          }
          return false;
        };
      }
    }
  </script>
</head>

<body>
  <center>
    <div>
      <!-- <h1>Balatro</h1> -->
      <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" width="100%" height="100%"></canvas>
    </div>
  </center>

  <script type='text/javascript'>
    window.callad = () => {
      window.parent.postMessage({
        type: 'adcall'
      }, '*');
    }
    var canvas = document.getElementById("loadingCanvas");
    canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;

    function goFullScreen() {
      var canvas = document.getElementById("canvas");
      if (canvas.requestFullScreen)
        canvas.requestFullScreen();
      else if (canvas.webkitRequestFullScreen)
        canvas.webkitRequestFullScreen();
      else if (canvas.mozRequestFullScreen)
        canvas.mozRequestFullScreen();
    }

    function FullScreenHook() {
      var canvas = document.getElementById("canvas");
      canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
    }
    var loadingContext = document.getElementById('loadingCanvas').getContext('2d');

    function drawLoadingText(text) {
      var canvas = loadingContext.canvas;

      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(0, 0, canvas.scrollWidth, canvas.scrollHeight);

      loadingContext.font = '2em arial';
      loadingContext.textAlign = 'center'
      loadingContext.fillStyle = "rgb( 11, 86, 117 )";
      loadingContext.fillText(text, canvas.scrollWidth / 2, canvas.scrollHeight / 2);

      // loadingContext.fillText("Powered By Emscripten.", canvas.scrollWidth / 2, canvas.scrollHeight / 4);
      // loadingContext.fillText("Powered By LÖVE.", canvas.scrollWidth / 2, canvas.scrollHeight / 4 * 3);
    }

    window.onload = function() {
      window.focus();
    };
    window.onclick = function() {
      window.focus();
    };

    window.addEventListener("keydown", function(e) {
      // space and arrow keys
      if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
        e.preventDefault();
      }
    }, false);

    var Module = {
      arguments: ["./data"],
      INITIAL_MEMORY: 256000000,
      printErr: console.error.bind(console),
      canvas: (function() {
        var canvas = document.getElementById('canvas');

        // As a default initial behavior, pop up an alert when webgl context is lost. To make your
        // application robust, you may want to override this behavior before shipping!
        // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
        canvas.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. You will need to reload the page.');
          e.preventDefault();
        }, false);

        return canvas;
      })(),
      setStatus: function(text) {
        if (text) {
          drawLoadingText(text);
        } else if (Module.remainingDependencies === 0) {
          document.getElementById('loadingCanvas').style.display = 'none';
          document.getElementById('canvas').style.visibility = 'visible';
        }
      },
      totalDependencies: 0,
      remainingDependencies: 0,
      monitorRunDependencies: function(left) {
        this.remainingDependencies = left;
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = function(event) {
      // TODO: do not warn on ok events like simulating an infinite loop or exitStatus
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) Module.printErr('[post-exception status] ' + text);
      };
    };

    var applicationLoad = function(e) {
      if (window.__onCloudSaveReady) {
        window.__onCloudSaveReady(function() { Love(Module); });
      } else {
        Love(Module);
      }
    }
  </script>
  <script type="text/javascript" src="game.js"></script>
  <script async type="text/javascript" src="love.js" onload="applicationLoad(this)"></script>
